[package]
name = "tinkjam-sync"
# The release version; scripts/build.sh adds the build stamp (UTC yyyymmddhhmm) as TINKJAM_BUILD.
version = "1.0.5"
edition = "2021"
publish = false
description = "Tinkjam Sync for Linux: connects the agents on this computer to Tinkjam"
license = "MIT"

[features]
default = ["gui"]
# The desktop app: windows (egui) and the tray icon (StatusNotifierItem). Without it, the same
# engine builds as the headless `tinkjam-sync-cli` for servers.
gui = ["dep:eframe", "dep:ksni", "dep:image", "dep:zbus", "dep:winit"]

[dependencies]
base64 = "0.22"
flate2 = "1"
libc = "0.2"
lzma-rs = "0.3"
p256 = { version = "0.13", default-features = false, features = ["ecdsa", "std"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tar = { version = "0.4", default-features = false }
ureq = { version = "2", default-features = false, features = ["tls", "native-certs", "gzip"] }

eframe = { version = "0.31", optional = true, default-features = false, features = [
  "glow",
  "wayland",
  "x11",
  "default_fonts",
  "accesskit",
] }
image = { version = "0.25", optional = true, default-features = false, features = ["jpeg", "png"] }
ksni = { version = "0.3", optional = true, default-features = false, features = [
  "async-io",
  "blocking",
] }
zbus = { version = "5", optional = true, default-features = false, features = [
  "async-io",
  "blocking-api",
] }
# Only for its feature: title bars drawn by the window itself where the desktop draws none (GNOME on Wayland).
winit = { version = "0.30", optional = true, default-features = false, features = [
  "wayland-csd-adwaita",
] }

[[bin]]
name = "tinkjam-sync"
path = "src/main.rs"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
panic = "abort"
